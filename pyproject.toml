[project]
name = "httpmark"
version = "0.3.0"
description = "Benchmark suite for Python HTTP clients: sync/async, HTTP/1.1 and HTTP/2, with process isolation and CPU pinning"
readme = "README.md"
license = "MIT"
authors = [
    { name = "vffuunnyy", email = "vffuunnyy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13",
    "httpx[http2]>=0.28",
    "httpcore[http2]>=1.0",
    "niquests>=3.18",
    "impit>=0.12",
    "primp>=1.1",
    "rnet>=3.0.0rc22",
    "requests>=2.32",
    "rich>=14",
    "curl-cffi>=0.16",
    "pyreqwest>=0.12",
    "aiosonic>=1.0",
    "pycurl>=7.47",
    "wreq>=0.12",
    "zapros>=0.16",
    "httpx-aiohttp>=0.2",
]

[project.scripts]
httpmark = "httpmark.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
